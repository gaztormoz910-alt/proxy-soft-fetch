# Сборка ProxyPulse и публикация релиза по тегу.
#
# Как выпустить новую версию:
#     git tag v4.1
#     git push origin v4.1
#
# Дальше всё делает GitHub: собирает .exe, компилирует установщик, создаёт
# релиз и прикрепляет к нему файл. Ссылка
# .../releases/latest/download/ProxyPulse-setup.exe начинает отдавать новую
# сборку автоматически — рассылать людям новый адрес не нужно.
#
# Кнопка "Run workflow" на вкладке Actions собирает то же самое без тега,
# но релиз не публикует — только кладёт файл в артефакты для проверки.

name: build-installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write        # нужно, чтобы создать релиз и залить в него файл

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.22.2

      - name: Определить версию
        id: ver
        shell: pwsh
        run: |
          # Из тега v4.1 получаем 4.1. При ручном запуске тега нет — берём 0.0,
          # чтобы сборка не падала и было видно, что это не релизная версия.
          $v = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' -replace '^v', '' } else { '0.0' }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "version = $v"

      - name: Записать версию в единственный источник
        run: python tools/set_version.py ${{ steps.ver.outputs.version }}

      - name: Собрать .exe
        run: python -m PyInstaller --noconfirm --clean --log-level WARN ProxyPulse.spec

      - name: Собрать установщик
        shell: pwsh
        run: |
          # На образе windows-latest Inno Setup обычно уже стоит; если версия
          # образа сменится и его не окажется — ставим сами, чтобы workflow
          # не развалился молча.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup не найден, ставлю через choco"
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe не найден после установки" }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" ProxyPulse.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Запустить собранную программу
        shell: pwsh
        run: |
          # Без этого шага можно выпустить релиз, который не стартует: PyInstaller
          # не падает на отсутствующей зависимости, он просто её не кладёт, и
          # программа умирает уже у пользователя. Ровно так уехал релиз 4.0.1 —
          # в requirements.txt не было Pillow, и окно открывалось с текстом
          # "Unhandled exception in script".
          $p = Start-Process -FilePath "dist\ProxyPulse\ProxyPulse.exe" -PassThru
          Start-Sleep -Seconds 25
          $p.Refresh()
          if ($p.HasExited) { throw "программа завершилась сама, код $($p.ExitCode)" }
          $title = $p.MainWindowTitle
          Write-Host "заголовок окна: '$title'"
          Stop-Process -Id $p.Id -Force
          # PyInstaller показывает трейсбек именно в окне с таким заголовком.
          if ($title -notlike 'ProxyPulse*') { throw "неожиданный заголовок окна: '$title'" }

      - name: Проверить, что установщик собрался
        shell: pwsh
        run: |
          $f = "installer\ProxyPulse-setup.exe"
          if (-not (Test-Path $f)) { throw "нет файла $f" }
          $mb = [math]::Round((Get-Item $f).Length / 1MB, 1)
          Write-Host "ProxyPulse-setup.exe = $mb MB"
          # Пустой или обрезанный файл лучше поймать здесь, чем у пользователя.
          if ($mb -lt 15) { throw "установщик подозрительно мал: $mb MB" }

      - name: Сохранить в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: ProxyPulse-setup
          path: installer/ProxyPulse-setup.exe

      - name: Опубликовать релиз
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: ProxyPulse ${{ steps.ver.outputs.version }}
          files: installer/ProxyPulse-setup.exe
          body: |
            **Windows 10/11, 64-bit.** Download `ProxyPulse-setup.exe` below and run it — Python and all dependencies are bundled, nothing else to install.

            Windows will show a blue "Windows protected your PC" screen on first run. That is expected for any installer without a paid code-signing certificate: click **More info** → **Run anyway**.

            The app installs into your user profile, so no administrator rights are needed. On first launch it downloads a country database (~9 MB) automatically. Interface language: English or Russian.

            ---

            **Windows 10/11, 64-bit.** Скачайте `ProxyPulse-setup.exe` ниже и запустите — Python и все библиотеки внутри, ставить отдельно ничего не нужно. Программа устанавливается в профиль пользователя, права администратора не требуются.
