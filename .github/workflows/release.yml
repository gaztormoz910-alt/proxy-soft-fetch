name: build-installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      SOURCE_DATE_EPOCH: "315532800"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.22.2 pefile

      - name: Verify clean sources
        run: |
          python tools/verify_scrub.py --selftest --verify
          python tools/scrub_pe.py --selftest

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' -replace '^v', '' } else { '0.0' }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "version = $v"

      - name: Set version
        run: python tools/set_version.py ${{ steps.ver.outputs.version }}

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --log-level WARN ProxyPulse.spec

      - name: Scrub executable metadata
        shell: pwsh
        run: |
          python tools/scrub_pe.py --clean  dist/ProxyPulse/ProxyPulse.exe
          python tools/scrub_pe.py --verify dist/ProxyPulse/ProxyPulse.exe
          if ($LASTEXITCODE -ne 0) { throw "scrub_pe failed on ProxyPulse.exe" }
          if (Test-Path "dist/ProxyPulse-standalone.exe") {
            python tools/scrub_pe.py --clean  dist/ProxyPulse-standalone.exe
            python tools/scrub_pe.py --verify dist/ProxyPulse-standalone.exe
            if ($LASTEXITCODE -ne 0) { throw "scrub_pe failed on ProxyPulse-standalone.exe" }
            New-Item -ItemType Directory -Path installer -Force | Out-Null
            Copy-Item dist/ProxyPulse-standalone.exe installer/ProxyPulse.exe
          }

      - name: Build installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Find-ISCC {
            foreach ($c in @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
              "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
              "$env:RUNNER_TEMP\InnoSetup6\ISCC.exe")) {
              if (Test-Path $c) { return $c }
            }
            return $null
          }
          $iscc = Find-ISCC
          if (-not $iscc) {
            $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe"
            $sha = "9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732"
            $exe = Join-Path $env:RUNNER_TEMP "innosetup-6.7.3.exe"
            $dir = Join-Path $env:RUNNER_TEMP "InnoSetup6"
            Invoke-WebRequest -Uri $url -OutFile $exe -UseBasicParsing
            $got = (Get-FileHash $exe -Algorithm SHA256).Hash
            if ($got -ne $sha) { throw "Inno Setup SHA256 mismatch: $got" }
            $p = Start-Process -FilePath $exe -Wait -PassThru -ArgumentList `
              "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-","/NOICONS","/CURRENTUSER","/DIR=$dir"
            if ($p.ExitCode -ne 0) { throw "Inno Setup install exited with code $($p.ExitCode)" }
            $iscc = Find-ISCC
          }
          if (-not $iscc) { throw "ISCC.exe not found after installation" }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" ProxyPulse.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }

      - name: Scrub installer metadata
        run: |
          python tools/scrub_pe.py --clean  installer/ProxyPulse-setup.exe
          python tools/scrub_pe.py --verify installer/ProxyPulse-setup.exe

      - name: Smoke GUI startup
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\ProxyPulse\ProxyPulse.exe" -PassThru
          Start-Sleep -Seconds 25
          $p.Refresh()
          if ($p.HasExited) { throw "app exited early with code $($p.ExitCode)" }
          $title = $p.MainWindowTitle
          Write-Host "window title: '$title'"
          Stop-Process -Id $p.Id -Force
          if ($title -and ($title -notlike 'ProxyPulse*')) { throw "unexpected window title: '$title'" }

      - name: Verify installer size
        shell: pwsh
        run: |
          $f = "installer\ProxyPulse-setup.exe"
          if (-not (Test-Path $f)) { throw "missing $f" }
          $mb = [math]::Round((Get-Item $f).Length / 1MB, 1)
          Write-Host "ProxyPulse-setup.exe = $mb MB"
          if ($mb -lt 15) { throw "installer suspiciously small: $mb MB" }

      - name: Build deterministic portable ZIP
        shell: pwsh
        run: |
          python -c "
          import zipfile, os
          epoch = 315532800
          dst = 'installer/ProxyPulse-portable.zip'
          src = 'dist/ProxyPulse'
          for root, dirs, files in os.walk(src):
              for f in files:
                  fp = os.path.join(root, f)
                  os.utime(fp, (epoch, epoch))
          with zipfile.ZipFile(dst, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as zf:
              for root, dirs, files in os.walk(src):
                  dirs.sort(); files.sort()
                  for f in files:
                      fp = os.path.join(root, f)
                      arc = os.path.relpath(fp, src).replace(os.sep, '/')
                      zi = zipfile.ZipInfo(arc, (1980, 1, 1, 0, 0, 0))
                      zi.external_attr = 0o644 << 16
                      zi.compress_type = zipfile.ZIP_DEFLATED
                      with open(fp, 'rb') as sf:
                          zf.writestr(zi, sf.read())
          with zipfile.ZipFile(dst, 'r') as zf:
              bad = [i.filename for i in zf.infolist() if i.date_time != (1980, 1, 1, 0, 0, 0) or i.extra]
              assert not bad, f'dirty zip entries: {bad[:5]}'
          print('Portable ZIP verified:', dst)
          "

      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        continue-on-error: true
        with:
          name: ProxyPulse-release
          path: |
            installer/ProxyPulse-setup.exe
            installer/ProxyPulse.exe
            installer/ProxyPulse-portable.zip

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: ProxyPulse ${{ steps.ver.outputs.version }}
          files: |
            installer/ProxyPulse-setup.exe
            installer/ProxyPulse.exe
            installer/ProxyPulse-portable.zip
          body: |
            **Windows 10/11, 64-bit.**
            - **`ProxyPulse.exe`**: standalone portable single-file executable (no installation needed, perfect for Windows VPS!).
            - **`ProxyPulse-setup.exe`**: full desktop installer (no admin rights needed, installs into user profile).
            - **`ProxyPulse-portable.zip`**: portable zip archive containing the application and offline database.

            Windows will show a blue "Windows protected your PC" screen on first run. That is expected for any executable/installer without a paid code-signing certificate: click **More info** → **Run anyway**.

            On first launch it downloads a country database (~9 MB) automatically. Interface language: English or Russian.

            ---

            **Windows 10/11, 64-bit.**
            - **`ProxyPulse.exe`**: автономный портативный одиночный exe-файл (установка не требуется, идеально для Windows VPS!).
            - **`ProxyPulse-setup.exe`**: инсталлятор для рабочего стола (права администратора не требуются, ставится в профиль пользователя).
            - **`ProxyPulse-portable.zip`**: портативный автономный архив для Windows VPS. Просто распакуйте и запустите `ProxyPulse.exe`.

            При первом запуске Windows может показать синий экран SmartScreen — нажмите **Подробнее** → **Выполнить в любом случае**. Язык интерфейса: Русский / Английский.

      - name: Remove previous releases
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
          }
          $api = "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100"
          $rels = Invoke-RestMethod -Uri $api -Headers $headers -Method Get
          foreach ($r in $rels) {
            if ($r.tag_name -ne '${{ github.ref_name }}') {
              Write-Output "Deleting old release id=$($r.id) tag=$($r.tag_name)"
              Invoke-RestMethod -Uri "https://api.github.com/repos/${{ github.repository }}/releases/$($r.id)" -Headers $headers -Method Delete
            }
          }
